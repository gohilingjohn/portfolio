  </defs>

  <circle cx="128" cy="128" r="126" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="119" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="128" cy="128" r="106" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.35"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.18"/>

  <text x="128" y="150" font-family="'Space Grotesk','Inter',sans-serif" font-size="74" font-weight="700" fill="url(#text)" text-anchor="middle" letter-spacing="1">JG</text>

  <!-- play-button accent (video pipeline) -->
  <path d="M178 176 l20 11 -20 11 z" fill="#22d3ee" opacity="0.9"/>
  <!-- candlestick pair (trading bot) -->
  <rect x="56" y="166" width="7" height="26" rx="2" fill="#7c3aed" opacity="0.9"/>
  <line x1="59.5" y1="158" x2="59.5" y2="166" stroke="#7c3aed" stroke-width="2" opacity="0.7"/>
  <rect x="70" y="156" width="7" height="36" rx="2" fill="#a78bfa" opacity="0.9"/>
  <line x1="73.5" y1="148" x2="73.5" y2="156" stroke="#a78bfa" stroke-width="2" opacity="0.7"/>
</svg>
